spring.application.name=backend

# Data da prova (Art. 5, I do regulamento). Unico lugar onde ela e definida.
corrida.data-prova=2027-03-14

# Perfil padrao: H2 em memoria, sem nenhuma configuracao externa.
spring.datasource.url=jdbc:h2:mem:corrida;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
